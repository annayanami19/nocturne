<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nocturne — Pengaturan</title>
    <style>
      :root {
        --bg: #0f172a;
        --surface: #1e293b;
        --surface-hover: #273449;
        --border: #334155;
        --text: #e2e8f0;
        --text-dim: #94a3b8;
        --accent: #f59e0b;
        --accent-soft: rgba(245, 158, 11, 0.16);
        --danger: #f87171;
        --success: #34d399;
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
        background: var(--bg);
        color: var(--text);
        font-size: 14px;
        min-height: 100vh;
      }
      .container { max-width: 640px; margin: 0 auto; padding: 32px 20px 48px; }
      header.page-header { display: flex; align-items: center; gap: 12px; margin-bottom: 24px; }
      .logo { font-size: 34px; filter: drop-shadow(0 0 10px rgba(245, 158, 11, 0.5)); }
      h1 { font-size: 22px; font-weight: 700; }
      .tagline { font-size: 12px; color: var(--text-dim); }
      .card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 18px;
        margin-bottom: 16px;
      }
      h2 { font-size: 15px; font-weight: 600; margin-bottom: 4px; }
      .desc { font-size: 12px; color: var(--text-dim); margin-bottom: 14px; }
      .add-row { display: flex; gap: 8px; }
      input[type="text"] {
        flex: 1;
        padding: 9px 12px;
        border-radius: 10px;
        border: 1px solid var(--border);
        background: var(--bg);
        color: var(--text);
        font-size: 13px;
      }
      input[type="text"]:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
      .btn {
        padding: 9px 14px;
        border-radius: 10px;
        border: 1px solid var(--border);
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
        transition: background 0.15s ease;
      }
      .btn-primary { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
      .btn-primary:hover { background: rgba(245, 158, 11, 0.28); }
      .btn-danger { background: transparent; border-color: var(--danger); color: var(--danger); }
      .btn-danger:hover { background: rgba(248, 113, 113, 0.12); }
      .btn-ghost { background: var(--surface); color: var(--text); }
      .btn-ghost:hover { background: var(--surface-hover); }
      .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
      .btn-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 12px; }
      .hidden-file-input { display: none; }

      /* Baris pengaturan + switch (dipakai card Perilaku) */
      .setting-list { display: flex; flex-direction: column; gap: 14px; }
      .setting-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        padding: 10px 12px;
        border: 1px solid var(--border);
        border-radius: 10px;
        background: var(--bg);
      }
      .setting-name { font-size: 13px; font-weight: 600; }
      .setting-desc { font-size: 12px; color: var(--text-dim); margin-top: 2px; }
      .switch {
        position: relative;
        flex-shrink: 0;
        width: 44px;
        height: 24px;
        border-radius: 999px;
        border: 1px solid var(--border);
        background: var(--bg);
        cursor: pointer;
        transition: background 0.18s ease, border-color 0.18s ease;
      }
      .switch .knob {
        position: absolute;
        top: 2px;
        left: 2px;
        width: 18px;
        height: 18px;
        border-radius: 50%;
        background: var(--text-dim);
        transition: transform 0.18s ease, background 0.18s ease;
      }
      .switch.checked { background: var(--accent-soft); border-color: var(--accent); }
      .switch.checked .knob { transform: translateX(20px); background: var(--accent); }
      .switch:disabled { opacity: 0.4; cursor: not-allowed; }
      .switch:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

      /* Status inline (cek pembaruan, backup/restore) */
      .status { margin-top: 10px; font-size: 12px; }
      .status-success { color: var(--success); }
      .status-error { color: var(--danger); }
      .status-info { color: var(--text-dim); }
      .status-warning { color: var(--accent); }
      .status a { color: var(--accent); font-weight: 600; }
      ul.site-list { list-style: none; margin-top: 14px; display: flex; flex-direction: column; gap: 8px; }
      li.site-item {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        padding: 9px 12px;
        border: 1px solid var(--border);
        border-radius: 10px;
        background: var(--bg);
      }
      .site-name { font-family: Consolas, monospace; font-size: 13px; }
      .remove-btn {
        border: none;
        background: transparent;
        color: var(--text-dim);
        font-size: 15px;
        cursor: pointer;
        padding: 2px 8px;
        border-radius: 6px;
        line-height: 1;
      }
      .remove-btn:hover { color: var(--danger); background: rgba(248, 113, 113, 0.12); }
      .empty { margin-top: 14px; font-size: 13px; color: var(--text-dim); font-style: italic; }
      .error { margin-top: 10px; font-size: 12px; color: var(--danger); }
      footer.page-footer {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-top: 24px;
        font-size: 12px;
        color: var(--text-dim);
      }
    </style>
    <script type="module" crossorigin src="/assets/options.html-CUT29sJw.js"></script>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
